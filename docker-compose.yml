services:
  hello:
    profiles: ["hello"]
    build:
      context: .
      dockerfile: Dockerfile

  selenium-tests:
    profiles: ["tests"]
    build:
      context: ./SeleniumRepo
      dockerfile: Dockerfile
    init: true
    volumes:
      - ./SeleniumRepo/target:/workspace/target
      - ./SeleniumRepo/test-output:/workspace/test-output

  # Single-node Apache Kafka in KRaft mode (no ZooKeeper).
  #   From the host (mvn test on your PC):   localhost:9092
  #   From other compose services:           kafka:19092
  kafka:
    profiles: ["kafka", "kafka-tests"]
    image: apache/kafka:3.7.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker, so internal topics can only have 1 replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Consumers join groups immediately (faster tests)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by KafkaTopicManager, never by accident
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Runs the Kafka TestNG suite inside Docker against the kafka service.
  # Reuses the SeleniumRepo image; only the command and broker address differ.
  kafka-tests:
    profiles: ["kafka-tests"]
    build:
      context: ./SeleniumRepo
      dockerfile: Dockerfile
    init: true
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    command: ["mvn", "-B", "test", "-Dtestng.suite=src/test/resources/TestRunner/KafkaTests.xml"]
    volumes:
      - ./SeleniumRepo/target:/workspace/target
      - ./SeleniumRepo/test-output:/workspace/test-output
